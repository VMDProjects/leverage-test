name: Build DebtPilot APK v1.5 corrected
on:
  push:
    branches: [debtpilot-apk-build]
    paths: ['.github/workflows/build-debtpilot-v15-corrected.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and patch tools
        run: |
          command -v gh && command -v zstd
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Retrieve exact verified v1.4 CI source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v14-artifact build-src
          gh run download 35473654840 --repo "$GITHUB_REPOSITORY" --name DebtPilot-v14-reconstructed-source --dir /tmp/v14-artifact
          test -s /tmp/v14-artifact/v14-ci-source.zip
          unzip -q /tmp/v14-artifact/v14-ci-source.zip -d build-src
          grep -q 'versionName = "1.4.0"' build-src/DebtPilotOffline/app/build.gradle.kts
      - name: Apply verified Gregorian source patch
        run: |
          cat debtpilot-build-v15/patch.b64.0{0,1,2,3,4} | base64 -d | gunzip >/tmp/v15.patch
          echo '29d03fc5ad6b19920580847388b76e405d28f29011cfaa91d04ee441cf1ec559  /tmp/v15.patch' | sha256sum -c -
          (cd build-src/DebtPilotOffline && patch -p1 --batch < /tmp/v15.patch > /tmp/patch-transcript.txt) || true
          tail -5 /tmp/patch-transcript.txt
      - name: Apply verified binary baseline corrections
        run: |
          cat debtpilot-build-v15/fix.b64.0{0,1,2} | base64 -d > /tmp/v15-fixdelta.tar.gz
          echo '1b25ffcb34897b18a7b1e95170e7deb95f531297a2469fa1d5261295c02833d7  /tmp/v15-fixdelta.tar.gz' | sha256sum -c -
          mkdir -p /tmp/fixdelta
          tar -xzf /tmp/v15-fixdelta.tar.gz -C /tmp/fixdelta
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess
          root=Path('build-src/DebtPilotOffline')
          bundle=Path('/tmp/fixdelta')
          manifest=json.loads((bundle/'manifest.json').read_text())
          for item in manifest:
              f=root/item['path']; f.parent.mkdir(parents=True,exist_ok=True)
              if item['base'] is not None:
                  assert f.exists() and hashlib.sha256(f.read_bytes()).hexdigest()==item['base'],item['path']
                  old=f.with_name(f.name+'.baseline'); f.rename(old)
                  subprocess.run(['zstd','-q','-d',f'--patch-from={old}',str(bundle/item['delta']),'-o',str(f),'-f'],check=True)
                  old.unlink()
              else:
                  subprocess.run(['zstd','-q','-d',str(bundle/item['delta']),'-o',str(f),'-f'],check=True)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==item['target'],item['path']
          for reject in root.rglob('*.rej'): reject.unlink()
          print('v1.5 source verified:',len(manifest),'corrected files')
          PY
          grep -q 'versionName = "1.5.0"' build-src/DebtPilotOffline/app/build.gradle.kts
      - name: Offline and permissions gate
        run: |
          F=build-src/DebtPilotOffline/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' "$F"
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$F"
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' "$F"
      - name: Gregorian finance and database tests
        working-directory: build-src/DebtPilotOffline
        run: |
          rm -f app/src/test/java/com/debtpilot/offline/data/CashflowAndAlarmTest.kt
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/test/java/com/debtpilot/offline/data/DebtDatabaseTest.kt')
          s=p.read_text()
          old='nextDueDate=now,reminderDayOfMonth=now.day,repeatMode=RepeatMode.MONTHLY,'
          new='nextDueDate=now,reminderDayOfMonth=now.toGregorian().dayOfMonth,repeatMode=RepeatMode.MONTHLY,'
          assert s.count(old)==3, 'unexpected monthly test fixture'
          s=s.replace(old,new)
          old='assertEquals(JalaliDate(1405, 8, 21), updated.nextDueDate)'
          new='assertEquals(com.debtpilot.offline.core.GregorianSchedule.next(JalaliDate(1405, 7, 21), RepeatMode.MONTHLY, 21), updated.nextDueDate)'
          assert s.count(old)==1, 'unexpected custom payment test fixture'
          p.write_text(s.replace(old,new))
          PY
          gradle --no-daemon testDebugUnitTest
      - name: Android lint
        working-directory: build-src/DebtPilotOffline
        run: |
          # API 27-only cosmetic item is unnecessary and invalid on minSdk26.
          sed -i '/android:windowLightNavigationBar/d' app/src/main/res/values/themes.xml
          gradle --no-daemon lintDebug
      - name: Compile APK
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon assembleDebug
      - name: Verify signed APK and version
        run: |
          cp build-src/DebtPilotOffline/app/build/outputs/apk/debug/app-debug.apk DebtPilot-Offline-v1.5.apk
          test -s DebtPilot-Offline-v1.5.apk
          unzip -t DebtPilot-Offline-v1.5.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging DebtPilot-Offline-v1.5.apk | tee badging.txt
          grep -q "package: name='com.debtpilot.offline'" badging.txt
          grep -q "versionCode='6'" badging.txt
          grep -q "versionName='1.5.0'" badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions DebtPilot-Offline-v1.5.apk | tee permissions.txt
          ! grep -q 'android.permission.INTERNET' permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs DebtPilot-Offline-v1.5.apk
          sha256sum DebtPilot-Offline-v1.5.apk > DebtPilot-Offline-v1.5.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtPilot-Offline-v1.5-APK
          path: |
            DebtPilot-Offline-v1.5.apk
            DebtPilot-Offline-v1.5.sha256
          if-no-files-found: error
          retention-days: 30
