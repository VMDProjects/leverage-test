name: Build DebtPilot APK v1.4

on:
  push:
    branches: [debtpilot-apk-build]
    paths:
      - debtpilot-build-v14/**
      - .github/workflows/build-debtpilot-v14.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct verified v1.1 base
        run: |
          mkdir -p build-src
          cat debtpilot-build-v11/source.b64.00 debtpilot-build-v11/source.b64.01 debtpilot-build-v11/source.b64.02a debtpilot-build-v11/source.b64.02b debtpilot-build-v11/source.b64.02c debtpilot-build-v11/source.b64.03 debtpilot-build-v11/source.b64.04 debtpilot-build-v11/source.b64.05 debtpilot-build-v11/source.b64.06 > /tmp/debtpilot-v11.b64
          base64 -d /tmp/debtpilot-v11.b64 > /tmp/debtpilot-v11.zip
          echo '326c02a31978c6b49be95d51ee6843527ab670ddaa0e6c781e8104785efdef2e  /tmp/debtpilot-v11.zip' | sha256sum -c -
          unzip -q /tmp/debtpilot-v11.zip -d build-src
          cp debtpilot-build-v11/themes.xml build-src/DebtPilotOffline/app/src/main/res/values/themes.xml
      - name: Reconstruct verified v1.2 source
        run: |
          cat debtpilot-build-v12/patch_v12.py.part* > /tmp/patch_v12.py
          cat debtpilot-build-v12/patch_ui_v12.py.part* > /tmp/patch_ui_v12.py
          echo 'e298ba65faa5dc0d4a4281766808fbf98449d9dac3628796bacb0be065d19188  /tmp/patch_v12.py' | sha256sum -c -
          echo 'ebffd634332e953f0e02721241d24726eebc1deb4c8e598140070ece32c1e6cf  /tmp/patch_ui_v12.py' | sha256sum -c -
          sed -i 's#/mnt/data/debtpilot_v12/DebtPilotOffline#build-src/DebtPilotOffline#g' /tmp/patch_v12.py /tmp/patch_ui_v12.py
          python /tmp/patch_v12.py
          python /tmp/patch_ui_v12.py
          echo 'f01390ae5d0202c35265f43608103cd405268be79e365ca0b4773f2dc8747aee  build-src/DebtPilotOffline/app/src/main/java/com/debtpilot/offline/ui/DebtPilotApp.kt' | sha256sum -c -
      - name: Apply verified v1.3 patch
        run: |
          cat debtpilot-build-v13/patch.b64.00 debtpilot-build-v13/patch.b64.01 debtpilot-build-v13/patch.b64.02 debtpilot-build-v13/patch.b64.03 > /tmp/v13.b64
          base64 -d /tmp/v13.b64 > /tmp/v13.patch.gz
          echo '176c49727e64fd0a55dd29d73dba1d2b2d333f9f91f674d4424cba19c1cd0b28  /tmp/v13.patch.gz' | sha256sum -c -
          gunzip -c /tmp/v13.patch.gz > /tmp/v13.patch
          (cd build-src && patch -p1 --batch < /tmp/v13.patch)
          grep -q 'versionName = "1.3.0"' build-src/DebtPilotOffline/app/build.gradle.kts
      - name: Apply verified v1.4 patch
        run: |
          cat debtpilot-build-v14/patch.b64.00 debtpilot-build-v14/patch.b64.01 debtpilot-build-v14/patch.b64.02 debtpilot-build-v14/patch.b64.03 debtpilot-build-v14/patch.b64.04 > /tmp/v14.patch.b64
          base64 -d /tmp/v14.patch.b64 | gunzip > /tmp/v14.patch
          echo '7001ebd53f6c87081758d2eecc9c8d35ca223fac3442c39ca7b5e2fb29662b8b  /tmp/v14.patch' | sha256sum -c -
          (cd build-src/DebtPilotOffline && patch -p1 --batch < /tmp/v14.patch)
          grep -q 'versionName = "1.4.0"' build-src/DebtPilotOffline/app/build.gradle.kts
      - name: Privacy and permissions gate
        run: |
          MANIFEST=build-src/DebtPilotOffline/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' "$MANIFEST"
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
      - name: Run finance, alarm and persistence tests
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon testDebugUnitTest
      - name: Run Android lint
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon lintDebug
      - name: Build installable APK and device tests
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verify APK package and signature
        run: |
          cp build-src/DebtPilotOffline/app/build/outputs/apk/debug/app-debug.apk DebtPilot-Offline-v1.4.apk
          test -s DebtPilot-Offline-v1.4.apk
          unzip -t DebtPilot-Offline-v1.4.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging DebtPilot-Offline-v1.4.apk | tee /tmp/debtpilot-badging.txt
          grep -q "package: name='com.debtpilot.offline'" /tmp/debtpilot-badging.txt
          grep -q "versionCode='5'" /tmp/debtpilot-badging.txt
          grep -q "versionName='1.4.0'" /tmp/debtpilot-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions DebtPilot-Offline-v1.4.apk | tee /tmp/debtpilot-permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/debtpilot-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs DebtPilot-Offline-v1.4.apk
          sha256sum DebtPilot-Offline-v1.4.apk > DebtPilot-Offline-v1.4.sha256
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtPilot-Offline-v1.4-APK
          path: |
            DebtPilot-Offline-v1.4.apk
            DebtPilot-Offline-v1.4.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Emulator launch and alarm-delivery test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/DebtPilot-Offline-v1.4.apk"
            adb install -r "$GITHUB_WORKSPACE/build-src/DebtPilotOffline/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            adb shell pm grant com.debtpilot.offline android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.debtpilot.offline SCHEDULE_EXACT_ALARM allow || true
            adb shell am start -W -n com.debtpilot.offline/.MainActivity
            sleep 3
            adb shell pidof com.debtpilot.offline
            adb shell am instrument -w com.debtpilot.offline.test/androidx.test.runner.AndroidJUnitRunner
