name: Build DebtPilot APK

on:
  push:
    branches:
      - debtpilot-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack and verify DebtPilot source
        run: |
          rm -rf build-src
          mkdir build-src
          cat debtpilot-build/DebtPilotOffline.zip.b64.part* > DebtPilotOffline.zip.b64
          base64 -d DebtPilotOffline.zip.b64 > DebtPilotOffline.zip
          echo "43f28194bf1bb06f07f994d722a9b8311e02200d9d7ab02849d9df0235fe6357  DebtPilotOffline.zip" | sha256sum -c -
          unzip -q DebtPilotOffline.zip -d build-src
          test -f build-src/DebtPilotOffline/settings.gradle.kts

      - name: Run unit tests
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon testDebugUnitTest

      - name: Build installable debug APK
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp build-src/DebtPilotOffline/app/build/outputs/apk/debug/app-debug.apk DebtPilot-Offline-v1.0.apk

      - name: Verify APK package
        run: |
          test -s DebtPilot-Offline-v1.0.apk
          unzip -t DebtPilot-Offline-v1.0.apk >/dev/null
          sha256sum DebtPilot-Offline-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebtPilot-Offline-v1.0-APK
          path: DebtPilot-Offline-v1.0.apk
          if-no-files-found: error
          retention-days: 30
