name: Build DebtPilot APK v1.1

on:
  push:
    branches:
      - debtpilot-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct and verify v1.1 source
        run: |
          rm -rf build-src DebtPilotOffline-v1.1-source.zip DebtPilotOffline-v1.1-source.zip.b64
          mkdir build-src
          cat debtpilot-build-v11/source.b64.00 debtpilot-build-v11/source.b64.01 debtpilot-build-v11/source.b64.02a debtpilot-build-v11/source.b64.02b debtpilot-build-v11/source.b64.02c debtpilot-build-v11/source.b64.03 debtpilot-build-v11/source.b64.04 debtpilot-build-v11/source.b64.05 debtpilot-build-v11/source.b64.06 > DebtPilotOffline-v1.1-source.zip.b64
          base64 -d DebtPilotOffline-v1.1-source.zip.b64 > DebtPilotOffline-v1.1-source.zip
          echo "326c02a31978c6b49be95d51ee6843527ab670ddaa0e6c781e8104785efdef2e  DebtPilotOffline-v1.1-source.zip" | sha256sum -c -
          unzip -q DebtPilotOffline-v1.1-source.zip -d build-src
          test -f build-src/DebtPilotOffline/settings.gradle.kts
          cp debtpilot-build-v11/themes.xml build-src/DebtPilotOffline/app/src/main/res/values/themes.xml

      - name: Privacy gate
        run: |
          ! grep -R 'android.permission.INTERNET' build-src/DebtPilotOffline/app/src/main/AndroidManifest.xml

      - name: Run unit and persistence tests
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon lintDebug

      - name: Build APK
        working-directory: build-src/DebtPilotOffline
        run: gradle --no-daemon assembleDebug

      - name: Prepare final APK
        run: |
          cp build-src/DebtPilotOffline/app/build/outputs/apk/debug/app-debug.apk DebtPilot-Offline-v1.1.apk
          test -s DebtPilot-Offline-v1.1.apk
          unzip -t DebtPilot-Offline-v1.1.apk >/dev/null

      - name: Verify package, privacy, and Android signature
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging DebtPilot-Offline-v1.1.apk | tee apk-badging.txt
          grep -q "package: name='com.debtpilot.offline'" apk-badging.txt
          grep -q "versionCode='2'" apk-badging.txt
          grep -q "versionName='1.1.0'" apk-badging.txt
          "$AAPT" dump permissions DebtPilot-Offline-v1.1.apk | tee apk-permissions.txt
          ! grep -q "android.permission.INTERNET" apk-permissions.txt
          "$APKSIGNER" verify --verbose --print-certs DebtPilot-Offline-v1.1.apk
          sha256sum DebtPilot-Offline-v1.1.apk | tee DebtPilot-Offline-v1.1.sha256

      - name: Emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/DebtPilot-Offline-v1.1.apk"
            adb shell am force-stop com.debtpilot.offline
            adb shell am start -W -n com.debtpilot.offline/.MainActivity
            sleep 3
            adb shell pidof com.debtpilot.offline
            adb shell dumpsys activity activities | grep -q "com.debtpilot.offline/.MainActivity"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtPilot-Offline-v1.1-APK
          path: |
            DebtPilot-Offline-v1.1.apk
            DebtPilot-Offline-v1.1.sha256
          if-no-files-found: error
          retention-days: 30
